<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="shortcut icon" href="./assets/icons/icon-favicon_Fotogram.svg" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./fonts.css">
    <link rel="stylesheet" href="./respo.css">

</head>

<body>
    <header>
        <div class="header-content">
            <img src="./assets/icons/icon-favicon_Fotogram.svg" alt="Fotogram-icon">
            <img src="./assets/icons/icon-Fotogram.svg" alt="Fotogram-lettering">
        </div>
    </header>
    <main>
        <h1>Your personal foto album</h1>
        <div class="album-container">
            <button class="album-element">
                <img src="./assets/img/img-Sea-and-Mountain.jpg" alt="img-Sea & Mountain">
            </button>
            <button class="album-element">
                <img src="./assets/img/img-city-at-night.jpg" alt="img-city at night">
            </button>
            <button class="album-element">
                <img src="./assets/img/img-dark-clouds.png" alt="img-dark clouds">
            </button>
            <button class="album-element">
                <img src="./assets/img/img-bird.jpg" alt="img-bird on a stone">
            </button>
            <button class="album-element">
                <img src="./assets/img/img-universum.jpg" alt="img-universum">
            </button>
            <button class="album-element">
                <img src="./assets/img/img-landscape-sea.jpg" alt="img-landscape_sea">
            </button>
            <button class="album-element">
                <img src="./assets/img/img-duck-on-sea.jpg" alt="img-duck on sea">
            </button>
            <button class="album-element">
                <img src="./assets/img/img-landscape-on-night.jpg" alt="img-landscape on night">
            </button>
            <button class="album-element">
                <img src="./assets/img/img-bird-on-a-stone.jpg" alt="img-bird on a stone">
            </button>
            <button class="album-element">
                <img src="./assets/img/img-leopard-baby.jpg" alt="img-a leopard baby">
            </button>
            <button class="album-element">
                <img src="./assets/img/img-landscape-of-mountains.jpg" alt="img-landscape of mountains">
            </button>
            <button class="album-element">
                <img src="./assets/img/img-tree-with-snow.jpg" alt="img-tree with snow">
            </button>
        </div>
    </main>
    <footer>
        <div class="footer-content">
            <div class="footer-logo">
                <img src="./assets/icons/Icon-DeveloperAkademie.svg" alt="icon der Developer Akademie">
                <img src="./assets/icons/icon-Text_Developer-Akademie.svg" alt="Developer Akademie lettering">
            </div>
            <p>© 2023 Developer Akademie GmbH</p>
        </div>
    </footer>
</body>

<dialog id="dialog">
    <header class="dialog-header">
        <h2 id="image-title"></h2>
        <button id="close-btn">
            <img src="./assets/icons/icon-Schliesen-button.svg" alt="icon-Schliesen-button">
        </button>
    </header>
    <div class="dialog-main-content">
        <img src="" alt="" id="dialog-img">
    </div>
    <footer class="dialog-footer">
        <button id="prev-btn" class="arrow-left">
            <img src="./assets/icons/icon-Arrow-left.svg" alt="icon-Arrow-left.svg">
        </button>
        <p id="image-counter"></p>
        <button id="next-btn" class="arrow-right">
            <img src="./assets/icons/icon-Arrow-Right.svg" alt="icon-Arrow-Right.svg">
        </button>
    </footer>
</dialog>

<script src="./script.js"></script>

</html>
